name: HIL Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build test firmware
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            -w /project/tests \
            espressif/idf \
            idf.py build