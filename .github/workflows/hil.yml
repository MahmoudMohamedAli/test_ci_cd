name: HIL Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build test firmware
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            -w /project/tests/hil \
            espressif/idf \
            idf.py build
      - name: Flash test firmware
        run: |
          docker run --rm \
            --device=/dev/ttyUSB0 \
            -v "${PWD}:/project" \
            -w /project/tests/hil \
            espressif/idf \
            idf.py -p /dev/ttyUSB0 flash
      
      - name: Run HIL tests
        run: |
          python3 tests/hil/run_hil.py 