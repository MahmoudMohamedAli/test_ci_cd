name: ESP32 Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Run unit tests
        run: |
          docker run --rm \
          -v "${PWD}:/project" \
          -w /project \
          espressif/idf \
          bash -c "gcc -Imain tests/test_logic.c main/math.c -o test_logic && ./test_logic"

      - name: Build ESP32 firmware
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            espressif/idf \
            idf.py build

      - name: Prepare firmware
        run: |
          mkdir -p firmware

          cp build/*.bin firmware/
          cp build/bootloader/bootloader.bin firmware/
          cp build/partition_table/partition-table.bin firmware/

          echo "Commit: $GITHUB_SHA" > firmware/version.txt
          echo "Build date: $(date -u)" >> firmware/version.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: firmware/