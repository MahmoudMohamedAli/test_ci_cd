name: ESP32 Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build ESP32 firmware
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            espressif/idf \
            idf.py build